# configs/data.yaml — shared data settings used by every experiment.
# Read by train/run.py, and copied into every run folder.

# Folder holding the input files. A relative path is taken from the repo
# root; on a cluster, an absolute path (/glade/...) works as it is.
data_dir: data

# Development data (2009-2024 historical, NorESM2-MM SSP3-7.0 2026-2040).
# Replace with the master-grid products when they arrive.
historical_raster: drivers_historical_20092024.tif
future_raster: drivers_NorESM2-MMssp370_20262040.tif   # uint32, values rounded: grid only
future_table: data_cmip6_fwivars_NorESM2-MMssp370.csv  # full-precision values, keyed by ID

target: burned01

# PROVISIONAL hand-picked variables, only for building the code.
# Selected by band name, so order here doesn't need to match the rasters.
variables:
  # vegetation
  - evergreen
  - decid
  - mixed
  - forest
  - wetland
  - unburnable
  - tcc
  # management / suppression
  - frac_Critical
  - frac_Full
  - frac_Modified
  # time since fire
  - ysb_mean
  - ysb_min
  - ysb_max
  # terrain
  - elevation_1km
  - slope_1km
  - TPI_1km
  - aspect_1km
  - flowacc_1km
  - twi_1km
  # fire weather
  - fwi_summer_mean
  - fwi_summer_max
  - fwi_summer_sum
  - fwi_annual_mean
  - fwi_annual_max
  - fwi_annual_sum

# Splitting (data/splits.py). Shared by every experiment, so all of them
# are tested on the same pixels and cross-validated on the same folds.
test_fraction: 0.1    # held-out test set, stratified; scored once at the very end
n_folds: 5            # cross-validation folds: random and stratified for now
random_seed: 1984

# Spatial cross-validation (phase 2, part 2: data/blocks.py)
block_size_km: 50     # placeholder; to be tuned
