# configs/experiments/mlp_tapered.yaml
# Two hidden layers that narrow (hidden -> hidden/2): defined in geocomp-2025
# but never trained, so there is no old result to compare with. Everything
# that defines the run lives here and is copied into runs/mlp_tapered/.

name: mlp_tapered                # = the run folder name; keep equal to this file's name
overwrite: true                  # during development, re-running replaces runs/mlp_tapered/

model:
  architecture: FeedforwardTapered  # class name in edf_dnn.models
  hidden_size: [128, 256]        # lists = values to grid-search over (geocomp-2025's grid)
  dropout: [0.1, 0.2]

training:
  learning_rate: [1.0e-3, 5.0e-4, 1.0e-4]
  batch_size: 4096
  max_epochs: 1000               # a time cap
  patience: 30                   # stop after 30 epochs without a better validation ROC AUC
  # Imbalance: every training fold is downsampled to 50/50 burned/unburned.

device: auto                     # auto = GPU if available, else CPU
